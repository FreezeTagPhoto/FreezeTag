      - application/json
      description: Sets the visibility mode of a user by their ID. The visibility
        mode determines who can see the user's profile and images. Accepts a query
        parameter "mode" with values 0, 1, or 2, where 0 means only the user can see
        their profile and images, 1 means anyone can see their profile but only followers
        can see their images, and 2 means anyone can see their profile and images.
        a user can only update their own visibility mode, but an admin with the appropriate
        permissions can update any user's visibility mode.
